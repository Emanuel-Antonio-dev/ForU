<!DOCTYPE html>
<html lang="pt">
<head>
y<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For U</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,500&family=Quicksand:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --night-deep: #171432;
    --night-mid: #2c2354;
    --night-soft: #3d2f66;
    --lavender: #c9b6f0;
    --rose: #f2a8c8;
    --gold: #f3d48e;
    --text-soft: #f5eefc;
    --text-dim: #b8aad4;
  }

  *{ box-sizing: border-box; margin:0; padding:0; }

  html,body{
    height:100%;
    overflow:hidden;
  }

  body{
    font-family:'Quicksand', sans-serif;
    background: radial-gradient(ellipse at 20% 20%, var(--night-soft), var(--night-mid) 45%, var(--night-deep) 100%);
    background-size: 200% 200%;
    animation: driftBg 22s ease-in-out infinite;
    color: var(--text-soft);
    position:relative;
    width:100vw;
    height:100vh;
  }

  @keyframes driftBg{
    0%,100%{ background-position: 20% 20%; }
    50%{ background-position: 80% 60%; }
  }

  /* twinkling stars layer */
  #stars{
    position:fixed; inset:0;
    pointer-events:none;
    z-index:0;
  }
  .star{
    position:absolute;
    width:2px; height:2px;
    background: var(--text-soft);
    border-radius:50%;
    opacity:.6;
    animation: twinkle 3.5s ease-in-out infinite;
  }
  @keyframes twinkle{
    0%,100%{ opacity:.15; transform:scale(1); }
    50%{ opacity:.9; transform:scale(1.6); }
  }

  .stage{
    position:fixed; inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    padding: 8vh 6vw;
    text-align:center;
    z-index:1;
    transition: opacity 1s ease;
  }

  .hidden{
    opacity:0;
    pointer-events:none;
  }

  /* ---------- STAGE 1: mensagens ---------- */

  #typewriter{
    font-family:'Cormorant Garamond', serif;
    font-weight:500;
    font-size: clamp(1.5rem, 4.2vw, 2.6rem);
    line-height:1.5;
    max-width: 780px;
    min-height: 8em;
    display:flex;
    align-items:center;
    justify-content:center;
    letter-spacing:.01em;
  }

  #typewriter .cursor{
    display:inline-block;
    width: .09em;
    background: var(--gold);
    margin-left:.1em;
    animation: blink 1s step-end infinite;
  }

  @keyframes blink{
    0%,100%{ opacity:1; }
    50%{ opacity:0; }
  }

  .eyebrow{
    font-family:'Quicksand', sans-serif;
    font-size:.75rem;
    letter-spacing:.35em;
    text-transform:uppercase;
    color: var(--gold);
    opacity:.75;
    margin-bottom: 2.2rem;
  }

  #enterBtn{
    margin-top: 3rem;
    background: transparent;
    border: 1px solid var(--lavender);
    color: var(--text-soft);
    font-family:'Quicksand', sans-serif;
    font-weight:500;
    font-size: .95rem;
    letter-spacing:.05em;
    padding: .9rem 2.2rem;
    border-radius: 999px;
    cursor:pointer;
    opacity:0;
    transform: translateY(10px);
    transition: opacity .8s ease, transform .8s ease, background .3s ease, border-color .3s ease;
  }
  #enterBtn.show{
    opacity:1;
    transform: translateY(0);
  }
  #enterBtn:hover, #enterBtn:focus-visible{
    background: rgba(201,182,240,.15);
    border-color: var(--gold);
    outline: none;
  }
  #enterBtn:focus-visible{
    box-shadow: 0 0 0 3px rgba(243,212,142,.4);
  }

  /* ---------- STAGE 2: cantinho de calma ---------- */

  #stage2{
    justify-content: space-between;
  }

  .corner-title{
    font-family:'Cormorant Garamond', serif;
    font-size: clamp(1.6rem, 3.5vw, 2.2rem);
    font-weight:500;
    margin-bottom:.3rem;
  }
  .corner-sub{
    font-size:.85rem;
    color: var(--text-dim);
    max-width: 480px;
  }

  .breath-wrap{
    position:relative;
    width: min(46vw, 260px);
    height: min(46vw, 260px);
    display:flex;
    align-items:center;
    justify-content:center;
    margin: 2rem 0;
  }

  .breath-ring{
    position:absolute;
    inset:0;
    border-radius:50%;
    border: 1px solid rgba(201,182,240,.35);
  }

  .breath-circle{
    width:55%;
    height:55%;
    border-radius:50%;
    background: radial-gradient(circle at 35% 30%, rgba(243,212,142,.55), rgba(242,168,200,.35) 55%, rgba(201,182,240,.25) 100%);
    box-shadow: 0 0 60px rgba(201,182,240,.35);
    animation: breathe 12s ease-in-out infinite;
  }

  @keyframes breathe{
    0%   { transform: scale(.72); }
    33%  { transform: scale(1);   }
    50%  { transform: scale(1);   }
    100% { transform: scale(.72); }
  }

  .breath-label{
    position:absolute;
    font-family:'Quicksand', sans-serif;
    font-size:.85rem;
    letter-spacing:.12em;
    text-transform:uppercase;
    color: var(--text-soft);
  }

  #bubbleField{
    position:relative;
    width:100%;
    max-width: 640px;
    height: 26vh;
    min-height: 160px;
  }

  .bubble{
    position:absolute;
    bottom:-40px;
    border-radius:50%;
    background: radial-gradient(circle at 35% 30%, rgba(255,255,255,.55), rgba(201,182,240,.18) 60%, rgba(201,182,240,.05));
    border: 1px solid rgba(245,238,252,.35);
    cursor:pointer;
    animation-name: floatUp;
    animation-timing-function: linear;
    animation-iteration-count: infinite;
  }

  @keyframes floatUp{
    0%   { transform: translateY(0) translateX(0); opacity:0; }
    8%   { opacity:.85; }
    100% { transform: translateY(-70vh) translateX(var(--drift, 20px)); opacity:0; }
  }

  .word-pop{
    position:absolute;
    font-family:'Cormorant Garamond', serif;
    font-style:italic;
    font-size:1.1rem;
    color: var(--gold);
    pointer-events:none;
    animation: wordFloat 1.6s ease-out forwards;
    white-space:nowrap;
  }
  @keyframes wordFloat{
    0%{ opacity:0; transform: translateY(0) scale(.9); }
    20%{ opacity:1; transform: translateY(-8px) scale(1); }
    100%{ opacity:0; transform: translateY(-46px) scale(1.05); }
  }

  .hint{
    font-size:.78rem;
    color: var(--text-dim);
    margin-top:1rem;
    letter-spacing:.02em;
  }

  .signature{
    font-family:'Cormorant Garamond', serif;
    font-style:italic;
    font-size:1rem;
    color: var(--text-dim);
    padding-bottom: 1.5rem;
  }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration: .001ms !important; animation-iteration-count: 1 !important; }
    body{ animation:none; }
    .breath-circle{ animation: none; }
  }
</style>
</head>
<body>

<div id="stars"></div>

<div class="stage" id="stage1">
  <div class="eyebrow">para ti</div>
  <div id="typewriter"><span id="typed"></span><span class="cursor">&nbsp;</span></div>
  <button id="enterBtn">entrar no meu cantinho</button>
</div>

<div class="stage hidden" id="stage2">
  <div>
    <div class="corner-title">o teu cantinho de calma</div>
    <div class="corner-sub">respira comigo, devagar. e quando quiseres, estoura umas bolhinhas ali em baixo — é só teu.</div>
  </div>

  <div class="breath-wrap">
    <div class="breath-ring"></div>
    <div class="breath-circle"></div>
    <div class="breath-label" id="breathLabel">inspira</div>
  </div>

  <div id="bubbleField"></div>

  <div class="hint">toca nas bolhas para soltares o peso do dia</div>
  <div class="signature">— sempre por ti, sempre para ti.</div>
</div>

<script>
  // ---------- stars ----------
  const starsLayer = document.getElementById('stars');
  const STAR_COUNT = 70;
  for(let i=0;i<STAR_COUNT;i++){
    const s = document.createElement('div');
    s.className = 'star';
    s.style.left = Math.random()*100 + 'vw';
    s.style.top = Math.random()*100 + 'vh';
    s.style.animationDelay = (Math.random()*3.5) + 's';
    s.style.animationDuration = (2.5 + Math.random()*3) + 's';
    starsLayer.appendChild(s);
  }

  // ---------- typewriter ----------
  const messages = [
    "Oi, minha deusa...",
    "Parece uma idiotice fazer isso, né?",
    "Mas enfim....",
    "Você tá bem?? Pareces tão cansadaaa, talvez eu consiga roubar-te um sorriso, quem sabe né!.",
    "Estarei sempre aqui, por ti e para ti.",
    "Não tenha medo, sinta-se acolhida e compreendida, converse cmg, seja você mesma",
    "Este cantinho aqui é só teu para respirares e soltares o peso do dia.",
    "Tal como disse Kendrick Lamar 'If this world was mine, I'd take your dreams and make 'em multiply'...",
    "If this world was mine, I'd take your enemies in front of God",
    "Bem, tu sabes inglês então percebeste",
    "(emoji de riso, muito risooooo).",
    "Hamm... provalvemente esse projecto irá auto-distriuir-se em 24h ou em 48, já nem lembro, (emoji de pessoa séria)",
    "A cada mordida, lembre-se de xingar algum imbecil, como dizes, kkk"
  ];

  const typedEl = document.getElementById('typed');
  const enterBtn = document.getElementById('enterBtn');

  function wait(ms){ return new Promise(r => setTimeout(r, ms)); }

  async function typeText(text){
    for(const ch of text){
      typedEl.textContent += ch;
      await wait(28 + Math.random()*30);
    }
  }

  async function eraseText(){
    while(typedEl.textContent.length){
      typedEl.textContent = typedEl.textContent.slice(0, -1);
      await wait(12);
    }
  }

  async function runMessages(){
    for(let i=0;i<messages.length;i++){
      await typeText(messages[i]);
      await wait(2200);
      if(i < messages.length - 1){
        await eraseText();
        await wait(300);
      }
    }
    enterBtn.classList.add('show');
  }

  runMessages();

  // ---------- stage transition ----------
  const stage1 = document.getElementById('stage1');
  const stage2 = document.getElementById('stage2');

  enterBtn.addEventListener('click', () => {
    stage1.classList.add('hidden');
    stage2.classList.remove('hidden');
    startBubbles();
  });

  // ---------- breathing label sync ----------
  const breathLabel = document.getElementById('breathLabel');
  const phases = [
    { text: 'inspira', duration: 4000 },
    { text: 'segura',  duration: 4000 },
    { text: 'expira',  duration: 4000 }
  ];
  let phaseIndex = 0;
  function cyclePhase(){
    breathLabel.textContent = phases[phaseIndex].text;
    phaseIndex = (phaseIndex + 1) % phases.length;
    setTimeout(cyclePhase, phases[phaseIndex === 0 ? phases.length - 1 : phaseIndex - 1].duration);
  }
  // start after small delay so it feels intentional
  setTimeout(cyclePhase, 400);

  // ---------- bubbles ----------
  const field = document.getElementById('bubbleField');
  const words = ["calma", "sinta-se acolhida","respira", "estás segura", "tudo bem", "um passo de cada vez", "estás no caminho certo","estou aqui", "vai correr tudo bem"];
  let bubblesStarted = false;

  function spawnBubble(){
    const b = document.createElement('div');
    b.className = 'bubble';
    const size = 22 + Math.random()*38;
    b.style.width = size + 'px';
    b.style.height = size + 'px';
    b.style.left = Math.random()*90 + '%';
    b.style.setProperty('--drift', (Math.random()*60 - 30) + 'px');
    const duration = 9 + Math.random()*7;
    b.style.animationDuration = duration + 's';

    b.addEventListener('click', () => {
      const rect = b.getBoundingClientRect();
      const fieldRect = field.getBoundingClientRect();
      const word = document.createElement('div');
      word.className = 'word-pop';
      word.textContent = words[Math.floor(Math.random()*words.length)];
      word.style.left = (rect.left - fieldRect.left) + 'px';
      word.style.top = (rect.top - fieldRect.top) + 'px';
      field.appendChild(word);
      setTimeout(() => word.remove(), 1700);
      b.remove();
      spawnBubble();
    });

    field.appendChild(b);
  }

  function startBubbles(){
    if(bubblesStarted) return;
    bubblesStarted = true;
    const initialCount = 10;
    for(let i=0;i<initialCount;i++){
      setTimeout(spawnBubble, i * 500);
    }
  }
</script>

</body>
</html>
